<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e8edf5;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 340px;
    padding: 20px;
    border-radius: 20px;
    background: #151b2b;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
}

.display {
    height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    color: white;
    padding: 15px 5px;
    overflow: hidden;
    margin-bottom: 15px;
}

#previous {
    color: #9ca3af;
    font-size: 18px;
    min-height: 25px;
}

#current {
    font-size: 38px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    height: 60px;
    border: none;
    border-radius: 12px;
    background: #263247;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: 0.15s ease-in-out;
}

button:hover {
    filter: brightness(1.3);
}

button:active {
    transform: scale(0.95);
}

.special {
    background: #374151;
    color: #93c5fd;
}

.operator {
    background: #f59e0b;
    font-weight: bold;
}

.equal {
    background: #16a34a;
    font-weight: bold;
}

@media (max-width: 400px) {
    .calculator {
        width: 92%;
    }
}
</style>
<body>
    <div class="calculator">
        <div class="display">
            <div id="previous"></div>
            <div id="current">0</div>
        </div>

        <div class="buttons">
            <button class="button special" id="clear">AC</button>
            <button class="button special" id="sign">+/-</button>
            <button class="button special" id="percent">%</button>
            <button class="button operator" id="divide">÷</button>
            
            <button class="button" id="seven">7</button>
            <button class="button" id="eight">8</button>
            <button class="button" id="nine">9</button>
            <button class="button operator" id="mul">×</button>
            
            <button class="button" id="four">4</button>
            <button class="button" id="five">5</button>
            <button class="button" id="six">6</button>
            <button class="button operator" id="minus">-</button>
            
            <button class="button" id="one">1</button>
            <button class="button" id="two">2</button>
            <button class="button" id="three">3</button>
            <button class="button operator" id="plus">+</button>
            
            <button class="button" id="dec">.</button>
            <button class="button" id="zero">0</button>
            <button class="button special" id="back">⌫</button>
            <button class="button equal" id="equal">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
